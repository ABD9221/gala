[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gala"
version = "0.1.0"
description = "Open-data places API: Overture Maps + OpenStreetMap + Wikidata"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "requests>=2.32",
    "rapidfuzz>=3.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gala-build = "scripts.build:main"

[tool.setuptools.packages.find]
include = ["gala*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
